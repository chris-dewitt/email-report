[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vollab"
version = "0.1.0"
description = "Derivatives pricing, Greeks, volatility-surface, and stochastic-simulation lab"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "polars>=1.0",
    "pyarrow>=15.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "typer[all]>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
vollab = "vollab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vollab", "src/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
