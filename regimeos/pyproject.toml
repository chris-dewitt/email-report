[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regimeos"
version = "0.1.0"
description = "Regime detection and decision-support orchestration engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "polars>=1.0",
    "pyarrow>=15.0",
    "duckdb>=0.10",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "typer[all]>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
copilot = [
    "ollama>=0.2",
]

[project.scripts]
regimeos = "regimeos.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/regimeos", "src/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
