[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedlens"
version = "0.1.0"
description = "Fed Communication Intelligence Engine — NLP, event studies, and agentic briefings for FOMC communications"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9.0",
    "polars>=1.0.0",
    "pyarrow>=14.0.0",
    "duckdb>=0.10.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "yfinance>=0.2.30",
    "fredapi>=0.5.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
fedlens = "fedlens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fedlens", "src/api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
