# FedLens Configuration
# Fed Communication Intelligence Engine

data_dir: ./data

# Ollama (local LLM)
ollama:
  host: http://localhost:11434
  model: mistral
  timeout_seconds: 300

# Embedding model (sentence-transformers)
embedding:
  model_name: all-MiniLM-L6-v2
  dimension: 384
  batch_size: 32
  device: cpu

# API server
api:
  host: 0.0.0.0
  port: 8001
  cors_origins:
    - http://localhost:5174
    - http://localhost:3000

# Event study parameters
event_study:
  pre_window_days: 2
  post_window_days: 5
  estimation_window_days: 120
  gap_days: 10
  benchmark_model: constant_mean
  history_start: "2010-01-01"

# Document ingestion
ingest:
  fed_base_url: https://www.federalreserve.gov
  scrape_delay_seconds: 1.5
  start_year: 2010
  chunk_size_tokens: 512
  chunk_overlap_tokens: 64
