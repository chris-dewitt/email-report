[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas"
version = "0.1.0"
description = "Macro intelligence platform for economic state tracking, feature engineering, and executive-quality monitoring"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9.0",
    "polars>=1.0.0",
    "pyarrow>=14.0.0",
    "duckdb>=0.10.0",
    "fredapi>=0.5.0",
    "yfinance>=0.2.30",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
research = [
    "streamlit>=1.30.0",
    "jupyter>=1.0.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
]

[project.scripts]
atlas = "atlas.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas", "src/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
